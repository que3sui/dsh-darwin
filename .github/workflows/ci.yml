name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (4 packages, strict)
        run: pnpm typecheck

      - name: Unit tests + lab experiments
        run: pnpm test

      - name: Lab report (E1~E5)
        run: pnpm lab

      - name: Upload LAB_REPORT.md
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lab-report
          path: LAB_REPORT.md
