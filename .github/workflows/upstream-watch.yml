name: upstream-watch

# 每周盯一次上游 @deepseek-ai/dsh 的 dist-tag；
# alpha 变化 → 自动开 issue 提醒核销 dsh-adapter.ts 的 TODO(verify) 并跑实机冒烟。
on:
  schedule:
    - cron: '0 3 * * 1' # 每周一 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream dist-tags
        id: upstream
        run: |
          JSON=$(curl -sf https://registry.npmjs.org/@deepseek-ai%2Fdsh)
          ALPHA=$(echo "$JSON" | jq -r '."dist-tags".alpha // "unknown"')
          LATEST=$(echo "$JSON" | jq -r '."dist-tags".latest // "unknown"')
          echo "alpha=$ALPHA" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Compare with pinned version
        id: compare
        run: |
          PINNED=$(cat .upstream-pin 2>/dev/null || echo "unknown")
          NEW="${{ steps.upstream.outputs.alpha }}"
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          if [ "$NEW" != "$PINNED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump pin, open issue
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW="${{ steps.upstream.outputs.alpha }}"
          OLD="${{ steps.compare.outputs.pinned }}"
          LATEST="${{ steps.upstream.outputs.latest }}"

          echo "$NEW" > .upstream-pin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .upstream-pin
          git commit -m "chore(upstream): dsh alpha $OLD -> $NEW"
          git push

          gh label create upstream-watch --color fbca04 --description "上游 DeepSeek Harness 版本变化" 2>/dev/null || true
          gh issue create \
            --title "上游更新：@deepseek-ai/dsh alpha $OLD → $NEW (latest $LATEST)" \
            --label "upstream-watch" \
            --body "上游 DeepSeek Harness 发布了新版本（预览期保证破坏性变更）。

          **待办清单：**
          - [ ] 跑实机冒烟：\`dsh plugin add\` sentinel + forge，\`darwin_scan\` / \`darwin_forge\` / \`darwin_promote\` 全链路
          - [ ] 核销 \`packages/sentinel/src/dsh-adapter.ts\` 与 \`packages/forge/src/dsh-adapter.ts\` 的 \`TODO(verify)\`（sessionQuery 形状 / storageDomain DomainSpec / tools.register）
          - [ ] 对齐 README 的兼容性声明，必要时改版发 minor

          适配层已收敛在两个 dsh-adapter.ts，理论上一处可改。"
